    if(ub){ ub.value = UNLOCK_PROMPT; }
    S.sysPrompt = UNLOCK_PROMPT; saveS();
    toast('预设已填入并保存');
    return;
  }
  if(e.target.id==='sysPromptClear'){
    S.sysPrompt=''; saveS();

    if(spb) spb.value='';
    toast('已清空');

  }
  if(e.target.id==='mTestKey'){ testApiKey(); return; }

  if(e.target.id==='mImportDS'){ pickDeepSeekBackup(); return; }
  if(e.target.id==='mShrinkImgs'){ shrinkAllImages(); return; }
  if(e.target.id==='mClear'){
    if(!confirm('清空全部对话？')) return;
    convs=[]; curId=null;
    // 清掉所有单条缓存，否则重开会被恢复
    idbAllKeys().then(function(ks){
      ks.filter(function(k){ return String(k).indexOf('conv_')===0; })
        .forEach(function(k){ idbDelKey(k).catch(function(){}); });
      idbSet('convs', []).catch(function(){});
    }).catch(function(){});
    saveC(); try{ localStorage.removeItem(CK); }catch(e){}
    renderConvs(); renderChat(); updateHeadTitle(); toast(t('cleared'));
  }
  if(e.target.id==='sbLogin'||e.target.id==='sbSignup'){
    var em=($('#sbEmail')||{}).value||'', pw=($('#sbPass')||{}).value||'';
    if(!em.trim()||!pw){ toast('请填写邮箱和密码'); return; }
    if(pw.length<6){ toast('密码至少 6 位'); return; }
    var isSignup=(e.target.id==='sbSignup');
    try{
      if(isSignup){
        var r1=await sbSignup(em.trim(),pw);
        if(r1==='confirm'){ toast('注册成功，请去邮箱点确认链接后再登录'); return; }
      } else {
        await sbLogin(em.trim(),pw);
      }
      toast('登录成功');
      $('#subScroll').innerHTML=subAccount();
      await sbSync();
      toast('已同步云端对话');
    }catch(err){
      toast((isSignup?'注册失败：':'登录失败：')+(err.message||''));
    }
    return;
  }
  if(e.target.id==='sbLogout' || e.target.id==='doLogout'){
    sbLogout(); toast('已退出登录');
    $('#subScroll').innerHTML=subLogout();
    renderSettings(); return;
  }
  if(e.target.id==='goLogin'){ openSub('account'); return; }
  if(e.target.id==='sbSync'){ toast('同步中…'); if(await sbSync()) toast('同步完成'); return; }
  if(e.target.id==='bgPick'){ $('#bgImage').click(); }
  if(e.target.id==='bgReset'){ S.bgImage=''; S.chatBg=''; saveS(); applyTheme(); renderSubTheme(); }
  var tp=e.target.closest('[data-ttsprov]');
  if(tp){ syncInputs(); S.tts.prov=tp.dataset.ttsprov; saveS(); $('#subScroll').innerHTML=subTts(); return; }
  var ps=e.target.closest('[data-preset]');
  if(ps){
    syncInputs();
    S.provider=ps.dataset.preset;
    if(S.provider==='deepseek'){
      S.baseUrl='https://api.deepseek.com';
      S.model='deepseek-flash';

function convToText(c){
  if(!c) return '';
  var out=[];
  out.push('《'+(c.title||'未命名')+'》');
  out.push('');
  (c.msgs||[]).forEach(function(m){
    var txt = String(m.content||'').trim();
    if(!txt) return;
    if(m.role==='user') out.push('［我］'+txt);
    else out.push(txt);
    out.push('');
  });
  return out.join('\n');
}

function exportText(onlyCurrent){
  var list = onlyCurrent ? [cur()] : convs;
  list = list.filter(Boolean);
  if(!list.length){ toast('没有可导出的对话'); return; }
  var txt = list.map(convToText).join('\n\n' + '─'.repeat(20) + '\n\n');
  var inWebView = /wv\)/.test(navigator.userAgent);
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  // iOS：下载不被支持，走系统分享
  if(isIOS && navigator.share){
    try{
      var file = null;
      try{
        file = new File([txt], (list[0].title||'对话')+'.txt', {type:'text/plain'});
      }catch(e){ file = null; }
      var shareData = file && navigator.canShare && navigator.canShare({files:[file]})
        ? {files:[file], title:(list[0].title||'对话')}
        : {text: txt, title:(list[0].title||'对话')};
      navigator.share(shareData).then(function(){ toast('已分享'); })
        .catch(function(){ copyText(txt); toast('已复制全文'); });
      return;
    }catch(e){ /* 落到复制 */ }
  }

  try{
    if(!inWebView && !isIOS){

var audioEl=$('#audio');
function hexToBytes(hex){
  hex=hex.replace(/[^0-9a-fA-F]/g,'');
  var n=hex.length/2, out=new Uint8Array(n);
  for(var i=0;i<n;i++) out[i]=parseInt(hex.substr(i*2,2),16);
  return out;
}
async function speak(text){
  text=String(text||'').replace(/```[\s\S]*?```/g,'').replace(/[#*`>]/g,'').trim();
  if(!text) return;
  text=text.slice(0,1200);
  var cfg=S.tts, prov=(cfg.prov||'openai').toLowerCase();
  if(!cfg.key||!cfg.base){ toast('请先在「朗读音色 → 自定义语音接口」里配置'); openSub('tts'); return; }
  var base=cfg.base.replace(/\/+$/,'');
  var v=voiceOf();
  try{
    var src;
    if(prov==='minimax'){
      var url=base+'/t2a_v2'+(cfg.group?('?GroupId='+encodeURIComponent(cfg.group)):'');
      var r1=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
        body:JSON.stringify({model:cfg.model||'speech-02-hd',text:text,stream:false,
          voice_setting:{voice_id:cfg.voice||v.minimax,speed:1,vol:1,pitch:0},
          audio_setting:{sample_rate:32000,bitrate:128000,format:'mp3'}})});
      var j=await r1.json().catch(function(){ return null; });
      if(!r1.ok){
        var em=(j&&j.base_resp&&j.base_resp.status_msg)||('HTTP '+r1.status);
        throw new Error(em);
      }
      if(j&&j.base_resp&&j.base_resp.status_code && j.base_resp.status_code!==0){
        throw new Error((j.base_resp.status_msg||'接口返回错误')+' ('+j.base_resp.status_code+')');
      }
      var hex=j&&j.data&&j.data.audio;
      if(!hex) throw new Error('返回里没有音频字段，检查模型名/音色ID是否正确');
      src=URL.createObjectURL(new Blob([hexToBytes(hex)],{type:'audio/mpeg'}));
    } else if(prov==='elevenlabs'){
      var r2=await fetch(base+'/text-to-speech/'+encodeURIComponent(cfg.voice||'21m00Tcm4TlvDq8ikWAM')+'?output_format=mp3_44100_128',
        {method:'POST',headers:{'Content-Type':'application/json','xi-api-key':cfg.key},
         body:JSON.stringify({text:text,model_id:cfg.model||'eleven_multilingual_v2'})});
      if(!r2.ok) throw new Error('HTTP '+r2.status);
      src=URL.createObjectURL(new Blob([await r2.arrayBuffer()],{type:'audio/mpeg'}));
    } else {
      var r3=await apiFetch(base+'/audio/speech',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
        body:JSON.stringify({model:cfg.model||'tts-1',input:text,voice:cfg.voice||v.openai})});
      if(!r3.ok) throw new Error('HTTP '+r3.status);
      src=URL.createObjectURL(new Blob([await r3.arrayBuffer()],{type:'audio/mpeg'}));
    }
    audioEl.src=src;
    audioEl.play().catch(function(){ toast('点击页面后即可播放'); });
  }catch(err){ toast('语音失败：'+((err&&err.message)||'')); }
}

var _katexState = 0; // 0=未加载 1=加载中 2=可用 -1=失败
var _katexCbs = [];
var _katexBase = './';   // 与网页同目录，本地/同源读取
function loadKatex(cb){
  if(window.katex){ _katexState=2; return cb(true); }
  if(_katexState===2) return cb(true);
  if(_katexState===-1) return cb(false);
  _katexCbs.push(cb);
  if(_katexState===1) return;
  _katexState = 1;

  var cssId='katexCss';
  if(!document.getElementById(cssId)){
    var link=document.createElement('link');
    link.id=cssId; link.rel='stylesheet'; link.href=_katexBase+'katex.min.css';
    document.head.appendChild(link);
  }
  var sc=document.createElement('script');
  sc.src=_katexBase+'katex.min.js';
  sc.onload=function(){
    _katexState = window.katex ? 2 : -1;
    _katexCbs.splice(0).forEach(function(f){ try{ f(_katexState===2); }catch(e){} });
  };
  sc.onerror=function(){
    _katexState = -1;
    _katexCbs.splice(0).forEach(function(f){ try{ f(false); }catch(e){} });
  };
  document.head.appendChild(sc);
}

// 把 KaTeX 不支持的宏剥掉/降级，尽量让公式能渲染出来
function sanitizeTex(tex){
  if(!tex) return '';
  var t = String(tex);

  // 从指定位置找到以 { 开头的平衡括号组，返回 {start, end, content}
  function readGroup(str, i){
    while(i < str.length && /\s/.test(str[i])) i++;
    if(str[i] !== '{') return null;
    var depth = 0, start = i;
    for(; i < str.length; i++){
      if(str[i] === '\\'){ i++; continue; }
      if(str[i] === '{') depth++;
      else if(str[i] === '}'){ depth--; if(depth === 0) return {end:i+1, content:str.slice(start+1, i)}; }
    }
    return null;
  }

  // 处理宏：keepLast=true 用最后一个花括号参数替换整个宏；false 直接删掉
  function stripMacro(str, name, keepLast){
    var guard = 0;
    while(guard++ < 60){
      var idx = str.indexOf('\\' + name);
      if(idx < 0) break;
      var j = idx + 1 + name.length;
      // 防止误伤 \scaleboxXX 之类
      if(/[a-zA-Z]/.test(str[j] || '')) { str = str.slice(0, idx) + '\u0000' + str.slice(idx + 1 + name.length); continue; }
      var args = [], cur = j;
      while(true){
        var g = readGroup(str, cur);
        if(!g) break;
        args.push(g.content); cur = g.end;
      }
      if(!args.length){
        var plain = str.indexOf('\\' + name);
        str = str.slice(0, plain) + str.slice(plain + 1 + name.length);
        continue;
      }
      var repl = keepLast ? args[args.length - 1] : '';
      str = str.slice(0, idx) + repl + str.slice(cur);
    }
    return str.replace(/\u0000/g, '');
  }

  // 包裹类：拆掉外壳保留内容
  ['scalebox','resizebox','colorbox','fcolorbox','shadowbox','fbox','mbox','makebox','framebox'].forEach(function(m){
    t = stripMacro(t, m, true);
  });

  // \textbf 依赖 AMS-Bold 字体（缺度量会报错），且里面不能放 \frac
  // 直接去掉外壳保留内容，颜色由 \textcolor 保住
  t = stripMacro(t, 'textbf', true);
  t = stripMacro(t, 'textit', true);
  t = stripMacro(t, 'textsl', true);

  // 纯命令：直接删
  ['hfill','hspace','vspace','vskip','noindent','indent','displaystyle','textstyle','scriptstyle',
   'selectfont','fontsize','baselineskip','centering','par','newpage','clearpage','smallskip',
   'medskip','bigskip','quad','qquad','enspace','thinspace'].forEach(function(m){
    t = stripMacro(t, m, false);
  });

  // 
  t = t.replace(/\\rule\s*(\[[^\]]*\])?\s*\{\s*0(pt|em|ex|mm|cm|in)?\s*\}\s*\{[^{}]*\}/g, '');
  // \hspace*{...}
  t = t.replace(/\\hspace\*?\s*\{[^{}]*\}/g, '');
  t = t.replace(/\\vspace\*?\s*\{[^{}]*\}/g, '');

  // 字号命令：KaTeX 不支持（注意先长后短，避免误伤）
  ['Huge','huge','LARGE','Large','large','normalsize','small','footnotesize','scriptsize','tiny'].forEach(function(m){
    t = stripMacro(t, m, false);
  });

  // array 列定义里的 @{\quad} 之类，KaTeX 不认 → 换成普通列（平衡括号读取，避免嵌套出错）
  (function fixArrayCols(){
    var out = '', i = 0, tag = '\\begin{array}{';
    while(true){
      var idx = t.indexOf(tag, i);
      if(idx < 0){ out += t.slice(i); break; }
      out += t.slice(i, idx);
      var st = idx + tag.length;
      var depth = 1, j = st;
      for(; j < t.length; j++){
        if(t[j] === '{') depth++;
        else if(t[j] === '}'){ depth--; if(depth === 0) break; }
      }
      var cols = t.slice(st, j);
      var clean = cols.replace(/@\{[^{}]*\}/g, '').replace(/[^lcr|]/g, '');
      if(!clean) clean = 'l';
      out += tag + clean + '}';
      i = j + 1;
    }
    t = out;
  })();

  // 中文间隔号「·」在数学模式会被 KaTeX 当成 \cdotp 报错 → 换成普通点
  t = t.replace(/·/g, ' ');
  t = t.replace(/¥/g, '\\yen ');

  // \textbf{} 里包数学命令会报「Cant use \frac in text mode」
  // 处理：内容含数学命令的，去掉 \textbf 外壳保留内容
  (function fixTextbf(){
    var guard = 0;
    while(guard++ < 40){
      var idx = t.indexOf('\\textbf{');
      if(idx < 0) break;
      var st = idx + '\\textbf{'.length;
      var depth = 1, j = st;
      for(; j < t.length; j++){
        if(t[j] === '{') depth++;
        else if(t[j] === '}'){ depth--; if(depth === 0) break; }
      }
      if(depth !== 0) break;
      var inner = t.slice(st, j);
      // 含数学构造 → 去外壳；否则保留（纯文本粗体没问题）
      if(/\\(frac|dfrac|sqrt|sum|int|begin\{array\}|overline|underline|times|cdot|yen)/.test(inner)){
        t = t.slice(0, idx) + inner + t.slice(j + 1);
      } else {
        // 跳过这个，继续找下一个
        var rest = t.slice(idx + 1);
        var pos = rest.indexOf('\\textbf{');
        if(pos < 0) break;
        t = t.slice(0, idx + 1) + rest;
      }
    }
  })();

  // 数学模式里嵌 $...$ → 去掉美元符
  t = t.replace(/\$([^$]*)\$/g, '$1');

  // emoji / 特殊字符：KaTeX 没有对应字形，移出数学模式或删掉
  t = t.replace(/[\u2B50\u26A0\uFE0F\u2705\u274C\u2764\u2665\u2728\uD83C-\uDBFF\uDC00-\uDFFF]/g, '');

  return t;
}

function renderMath(scope){
  var root = scope || document;
  var nodes = root.querySelectorAll('.math-block:not([data-done])');
  if(!nodes.length) return;
  loadKatex(function(ok){
    nodes.forEach(function(el){
      if(el.dataset.done) return;
      el.dataset.done='1';
      if(!ok || !window.katex) return;
      var tex = sanitizeTex(el.getAttribute('data-tex') || '');
      try{
        katex.render(tex, el, {displayMode:true, throwOnError:true, strict:false});
        el.classList.add('math-ok');
      }catch(e){
        // 渲染不了就当普通代码块原样显示，不报错
        el.classList.remove('math-ok');
        el.classList.add('math-raw');
      }
    });
  });
}

function fontDbOpen(){
  return new Promise(function(res, rej){
    if(!window.indexedDB) return rej(new Error('no idb'));
    var r=indexedDB.open('dsclone-fonts',1);
    r.onupgradeneeded=function(){ r.result.createObjectStore('fonts'); };
    r.onsuccess=function(){ res(r.result); };
    r.onerror=function(){ rej(r.error); };
  });
}
function fontDbPut(name, buf){
  return fontDbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx=db.transaction('fonts','readwrite');
      tx.objectStore('fonts').put(buf, name);
      tx.oncomplete=function(){ res(true); };
      tx.onerror=function(){ rej(tx.error); };
    });
  });
}
function fontDbGet(name){
  return fontDbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx=db.transaction('fonts','readonly');
      var rq=tx.objectStore('fonts').get(name);
      rq.onsuccess=function(){ res(rq.result); };
      rq.onerror=function(){ rej(rq.error); };
    });
  });
}
function fontDbDel(name){
  return fontDbOpen().then(function(db){
    return new Promise(function(res){
      var tx=db.transaction('fonts','readwrite');
      tx.objectStore('fonts').delete(name);
      tx.oncomplete=function(){ res(true); };
      tx.onerror=function(){ res(false); };
    });
  });
}
function fontDbKeys(){
  return fontDbOpen().then(function(db){
    return new Promise(function(res){
      var tx=db.transaction('fonts','readonly');
      var rq=tx.objectStore('fonts').getAllKeys();
      rq.onsuccess=function(){ res(rq.result||[]); };
      rq.onerror=function(){ res([]); };
    });
  });
}

function fontCssOf(key){
  if(!key) return FONTS.system.css;
  if(key.indexOf('custom:')===0){
    var n=key.slice(7);
    return '"'+n+'",' + FONTS.system.css;
  }
  return (FONTS[key]||FONTS.system).css;
}
function applyFont(){
  document.documentElement.style.setProperty('--font-main', fontCssOf(S.fontFamily));
}
async function registerCustomFont(name){
  try{
    var buf = await fontDbGet(name);
    if(!buf) return false;
    var ff = new FontFace(name, buf);

    document.fonts.add(ff);
    return true;
  }catch(e){ return false; }
}
function pickFontFile(){
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='.ttf,.otf,.woff,.woff2,font/*';
  inp.onchange=async function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    if(f.size > 8*1024*1024){ toast('字体文件超过 8MB，换个小一点的'); return; }
    var name=f.name.replace(/\.[^.]+$/,'');
    try{
      var buf=await f.arrayBuffer();
      await fontDbPut(name, buf);
      var ok=await registerCustomFont(name);
      if(!ok) throw new Error('load fail');
      S.fontFamily='custom:'+name; saveS(); applyFont(); refreshSub();
      toast('已导入并启用：'+name);
    }catch(e){ toast('导入失败：'+((e&&e.message)||'')); }
  };
  inp.click();
}

async function renderCustomFonts(){
  var box=$('#fontCustomList'); if(!box) return;

  box.innerHTML = keys.map(function(k){

    return '<div class="row"><span class="k tap" data-fontuse="'+esc(k)+'" style="'+(on?'color:var(--blue-txt);font-weight:500':'')+'">'+esc(k)+(on?' ✓':'')+'</span>'+
           '<span class="v tap" data-fontdel="'+esc(k)+'" style="color:#e5484d">删除</span></div>';
  }).join('');
}

async function initCustomFonts(){
  if(!S.fontFamily || S.fontFamily.indexOf('custom:')!==0) return;
  var n = S.fontFamily.slice(7);
  var ok = await registerCustomFont(n);
  if(ok){ applyFont(); return; }

  // 首次失败：等 300ms 重试（IndexedDB 冷启动偶尔慢）
  await new Promise(function(r){ setTimeout(r, 300); });
  ok = await registerCustomFont(n);
  if(ok){ applyFont(); return; }

  // 二次失败：保留选择，明确提示，不擅自改回系统默认
  toast('自定义字体「'+n+'」加载失败，可到 设置→个性化→字体 重新选择');
  applyFont();
}

var APK_URL = 'https://qiuli0306.github.io/deepseek/deepseek.apk';
var VER_URL = 'https://qiuli0306.github.io/deepseek/version.json';
var latestVer = null;
function apkVersionNow(){
  try{ return (window.DSApp && window.DSApp.apkVersion) ? String(window.DSApp.apkVersion()||'') : ''; }
  catch(e){ return ''; }
}

var _updLog = [], _needApk = false;

function renderUpdList(entries, needApk){

function showUpd(entries, needApk, title){
  _updLog = entries || [];
  _needApk = !!needApk;
  $('#updTitle').textContent = title || (needApk ? '有新版本可用' : '更新内容');
  renderUpdList(_updLog, _needApk);
  $('#updMask').classList.add('on');

function parseVer(v){
  // '2026-11-18 11:40' -> 可比较数字
  var m = String(v||'').match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
  if(!m) return 0;
  return Date.UTC(+m[1], +m[2]-1, +m[3], +m[4], +m[5]);
}

function checkUpdate(manual){
  fetch(VER_URL + '?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      latestVer = (j && j.ver) || null;
      var log = (j && j.log) || [];
      var seen = localStorage.getItem('dsclone_seen_ver') || '';
      var seenTs = parseVer(seen);

      // 本次页面版本 vs 最新版本：是否已经跑在新网页上
      var pageTs = parseVer(APP_VERSION);
      var latestTs = parseVer(latestVer);
      var pageIsLatest = latestTs ? (pageTs >= latestTs) : true;

      // 收集所有「比已读更新」的日志（合并展示）
      var pending = log.filter(function(it){ return parseVer(it.ver) > seenTs; }).slice(0, 5);
      if(manual && !pending.length) pending = log.slice(0, 3);   // 手动点开时也给他看最近几条

      var dot = $('#updDot');
      var showDot = pending.length && latestVer !== seen;
      if(dot) dot.style.display = showDot ? 'block' : 'none';

      // 原生包是否落后（需要重新安装）
      var needApkReinstall = false;
      try{
        var curApk = apkVersionNow();
        var latestApk = (j && j.apkVer) || '';
        if(curApk && latestApk && curApk !== latestApk) needApkReinstall = true;
      }catch(e){}

      if(needApkReinstall){
        var tips = pending.slice(0);
        tips.unshift({ver:'需要安装新版本 '+((j&&j.apkVer)||''), notes:['本次更新包含界面/系统层面的改动，重新安装后才会生效。','覆盖安装不会丢失聊天记录和设置。']});
        showUpd(tips, true, '需要安装新版本');
        return;
      }

      if(!pageIsLatest){
        // 页面内容旧了：只提示更新内容，不给下载按钮（避免误解成必须重装）
        showUpd(pending, false, '发现更新');
        return;
      }
      // 网页有更新：每次弹一次，点「知道了」后不再弹
      if(pending.length && latestVer !== seen){
        showUpd(pending, false, '更新内容');
        return;
      }
      if(pending.length && manual){
        showUpd(pending, false, '最近更新');
        return;
      }
      if(manual) toast('已是最新版本  ' + APP_VERSION);
    })
    .catch(function(){ if(manual) toast('检查更新失败，请稍后再试'); });
}

(function bootStorage(){
  (async function(){
    try{
      // 全量扫描恢复：把库里所有可能的对话都捞出来
      var keys = await idbAllKeys().catch(function(){ return []; });
      var recovered = [];
      for(var _i=0;_i<keys.length;_i++){
        var _k = keys[_i];
        if(String(_k)==='convs') continue;
        try{
          var _v = await idbGet(_k);
          if(_v && _v.id && _v.msgs) recovered.push(_v);
          else if(Array.isArray(_v) && _v.length && _v[0] && _v[0].msgs) recovered = recovered.concat(_v);
        }catch(e){}
      }
      var mainData = await idbGet('convs').catch(function(){ return null; });
      var cached = await loadConvCaches().catch(function(){ return []; });
      var all = [];
      if(Array.isArray(mainData)) all = all.concat(mainData);
      if(Array.isArray(cached)) all = all.concat(cached);
      if(Array.isArray(recovered)) all = all.concat(recovered);

      if(all.length){
        var map={};
        all.forEach(function(c){
          if(!c||!c.id) return;
          var o=map[c.id];
          if(!o || ((c.msgs||[]).length >= (o.msgs||[]).length)) map[c.id]=c;
        });
        convs.forEach(function(c){
          if(!c||!c.id) return;
          var o=map[c.id];
          if(!o || ((c.msgs||[]).length >= (o.msgs||[]).length)) map[c.id]=c;
        });
        convs = Object.keys(map).map(function(k){ return map[k]; })
                  .filter(function(c){ return Array.isArray(c.msgs); })
                  .sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
        renderConvs(); renderChat(); updateHeadTitle();
        try{ localStorage.removeItem(CK); }catch(e){}
      } else if(convs.length){
        // 首次从 localStorage 迁移
        await idbSet('convs', convs);
        try{ localStorage.removeItem(CK); localStorage.removeItem('dsclone_convs_v3'); localStorage.removeItem('dsclone_convs_v2'); }catch(e){}
      } else {
        window.__storeEmptyConfirmed = true;
      }

      _storeReady = true;
      _loaded = true;
      _storeState.idb='可用'; _storeState.ready=true; _storeState.count=convs.length;
      // 只有确实有数据、或确认是全新用户时才写回，避免空列表覆盖历史
      if(convs.length || window.__storeEmptyConfirmed){
        try{ idbSet('convs', convs).catch(function(){}); }catch(e){}
      }
    }catch(e){
      _storeReady = false;
      _loaded = true;
      _storeState.idb='不可用'; _storeState.err=String(e&&e.message||e).slice(0,60);
      setTimeout(function(){ toast('本地存储读取失败，本次聊天不会被保存'); }, 800);
    }
  })();
})();
