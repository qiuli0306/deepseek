<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>deepseek</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="deepseek">
<style>
:root{
  --bg:#0d0d0d; --card:#1c1c1c; --card2:#262626; --input:#161616;
  --fg:#ececec; --fg2:#9a9a9a; --fg3:#6b6b6b; --line:#2e2e2e;
  --blue:#4d6bfe; --blue-soft:#26305a; --blue-txt:#8ea2ff; --chev:#555;
  --bubble-user:#333333; --bubble-ai:#262626; --chat-bg:#0d0d0d;
  --fs:1;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
body[data-theme="light"]{
  --bg:#fbfbfb; --card:#ffffff; --card2:#f1f1f1; --input:#ffffff;
  --fg:#111111; --fg2:#8a8a8a; --fg3:#b0b0b0; --line:#e6e6e6;
  --blue-soft:#e6ecff; --blue-txt:#3f5bf6; --chev:#c4c4c4;
  --bubble-user:#dfe8ff; --bubble-ai:#ffffff; --chat-bg:#fbfbfb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
#bgLayer{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:var(--bg-img,none) center/cover no-repeat;
  background-color:var(--bg-color,transparent);
  opacity:var(--bg-alpha,1);
  filter:blur(var(--bg-blur,0px))}
body.menu-open #composer,body.menu-open #inputBar,body.menu-open .composer{opacity:.15;pointer-events:none}
body.menu-open .mdwrap{-webkit-touch-callout:none;user-select:none}
#msgs,#msgs *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#msgs .pickable,#msgs .pickable *{-webkit-touch-callout:default;-webkit-user-select:text;user-select:text}
#msgs textarea,#msgs input{-webkit-user-select:text;user-select:text}
#msgs .pickable{-webkit-touch-callout:default;-webkit-user-select:text;user-select:text}
body{background:var(--chat-bg);color:var(--fg);font-size:16px;line-height:1.65;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC","Hiragino Sans","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;font-size:inherit}
input,textarea{font-family:inherit;color:inherit;font-size:inherit}
.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--chat-bg);background-size:cover;background-position:center}
.main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}

/* 顶栏 */
.header{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:0 8px;padding-top:var(--safe-t)}
.ibtn{width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:var(--fg);flex:0 0 auto}
.ibtn:active{opacity:.45}
.ibtn.on{color:var(--blue)}
.header .title{flex:1;min-width:0;text-align:center;font-size:16px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}

/* 滚动 */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0}
.wrap{max-width:768px;margin:0 auto;padding:0 16px}

/* 欢迎 */
.welcome{padding-top:30vh;text-align:center}
.welcome .whale{width:34px;height:auto;display:block;margin:0 auto 12px}
.welcome h1{margin:0;font-size:18.5px;font-weight:600;letter-spacing:-.2px;line-height:1.45}
.welcome p{margin:10px 0 0;color:var(--fg2);font-size:14.5px}

/* 消息 */
.msgs{padding:18px 0 26px}
.msg{margin-bottom:28px}
.msg.user{display:flex;justify-content:flex-end}
.bubble{font-size:calc(15.5px * var(--fs));word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.user .bubble{max-width:86%;background:var(--bubble-user);border-radius:18px 18px 5px 18px;padding:9px 14px;
  backdrop-filter:blur(var(--bubble-blur,0px));-webkit-backdrop-filter:blur(var(--bubble-blur,0px))}
.msg.user .bubble .txt{margin-top:2px}
.usermeta{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:7px;color:var(--fg2);font-size:12.5px}
.usermeta .av{width:24px;height:24px;border-radius:50%;overflow:hidden;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--fg2)}
.usermeta .av img{width:100%;height:100%;object-fit:cover}
.usermeta .more{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg3)}
.usermeta .more:active{background:var(--card2)}

.body{font-size:calc(15.5px * var(--fs));word-break:break-word;overflow-wrap:anywhere}
.body p{margin:0 0 12px}
.body p:last-child{margin-bottom:0}
.body h1,.body h2,.body h3,.body h4{margin:18px 0 9px;line-height:1.4;font-weight:600}
.body h1{font-size:1.3em}.body h2{font-size:1.18em}.body h3{font-size:1.06em}.body h4{font-size:1em}
.body ul,.body ol{margin:0 0 12px;padding-left:22px}
.body li{margin:4px 0}
.body blockquote{margin:0 0 12px;padding:2px 0 2px 12px;border-left:3px solid var(--line);color:var(--fg2)}
.body hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.body a{color:var(--blue-txt);text-decoration:none}
.body strong{font-weight:600}
.body code.ic{background:var(--card2);padding:1.5px 5px;border-radius:5px;font-size:.9em;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.body table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:.92em;display:block;overflow-x:auto}
.body th,.body td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.body th{background:var(--card2);font-weight:600}

/* AI 气泡（对话框风格） */
.msg.ai{display:flex}
.msg .aiwrap{flex:1;min-width:0}
.row2{display:flex;gap:9px;align-items:flex-start}
.row2 .content{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.row2 .content>.bubble{align-self:flex-start}
.row2 .content>.tools{align-self:stretch}
.msg.user .row2 .bubble{max-width:100%}
.role-name{margin-bottom:7px}
.role-name{font-size:12px;color:var(--fg2);margin-bottom:5px;padding-left:3px;line-height:1.2}
.role-name.me{text-align:right;padding-right:3px}
.msg.user .wrapin{display:flex;flex-direction:column;align-items:flex-end;max-width:86%}
.msg.user .bubble{max-width:100%}
.msg.ai.multi .body{background:none!important;padding:0!important}
.multi .body .bubble{background:#262626;border-radius:16px;padding:10px 14px;margin-bottom:9px;
  font-size:calc(15.5px * var(--fs));white-space:normal;word-break:break-word;overflow-wrap:anywhere}
.multi .body .bubble:last-child{margin-bottom:0}
.style-command .multi .body .bubble{background:#262626;padding:10px 14px;border-radius:16px}
.style-command .msg.ai .bubble{background:none;padding:0}
.style-bubble .msg.ai .body{background:var(--bubble-ai);padding:9px 13px;border-radius:16px;max-width:88%;
  backdrop-filter:blur(var(--bubble-blur,0px));-webkit-backdrop-filter:blur(var(--bubble-blur,0px))}
.style-bubble .msg.ai .content>.bubble{background:var(--bubble-ai);backdrop-filter:blur(var(--bubble-blur,0px));
  -webkit-backdrop-filter:blur(var(--bubble-blur,0px));padding:9px 13px;border-radius:14px;
  line-height:1.55;font-size:calc(15.5px * var(--fs));white-space:normal;word-break:break-word;
  overflow-wrap:anywhere;max-width:86%}
.style-bubble .msg.ai .content>.bubble p{margin:0}
.style-bubble .msg.ai .content>.bubble p+p{margin-top:7px}
.style-bubble .msg.ai .content>.bubble ul,
.style-bubble .msg.ai .content>.bubble ol{margin:0;padding-left:20px}
.style-bubble .msg.ai .content>.bubble li{margin:3px 0}
.style-bubble .msg.ai .content>.bubble h1,
.style-bubble .msg.ai .content>.bubble h2,
.style-bubble .msg.ai .content>.bubble h3{margin:6px 0 4px}
.style-bubble .msg.ai .content>.bubble>*:first-child{margin-top:0}
.style-bubble .msg.ai .content>.bubble>*:last-child{margin-bottom:0}
.msg.ai.waifu{margin-bottom:10px}
.msg.ai.waifu .role-name{font-size:11px;color:var(--fg3);margin-bottom:4px;padding-left:1px}
.msg.ai.waifu .avatar{width:30px;height:30px;margin-top:0}
.msg.ai.waifu .avatar-ghost{width:30px;height:1px;flex:0 0 30px}
.msg.ai.waifu .row2{gap:8px}
.msg.ai.waifu .content>.bubble{border-radius:14px;font-size:calc(15px * var(--fs))}
.msg.ai.waifu:last-of-type{margin-bottom:24px}
.typing{display:inline-flex;gap:4px;align-items:center;padding:8px 12px;margin:2px 0 10px 40px;
  background:var(--bubble-ai);border-radius:14px;width:fit-content}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--fg3);animation:up 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
.style-bubble .msg.ai .body .bubble{background:none;padding:0;margin:0}
.style-command .msg.ai .body{background:none;padding:0}
.avatar{width:32px;height:32px;border-radius:50%;flex:0 0 auto;overflow:hidden;background:var(--card2);
  display:flex;align-items:center;justify-content:center;color:var(--fg2);margin-top:2px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar svg{width:100%;height:100%}

/* 消息工具条 */
.tools{display:flex;align-items:center;justify-content:space-between;margin-top:14px;color:var(--fg3)}
.tools .l{display:flex;align-items:center;gap:22px}
.tools .r{display:flex;align-items:center;gap:12px}
.tools button{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--fg3)}
.tools button:active{opacity:.5}
.tools svg{width:20px;height:20px}
.tools button.on{color:var(--blue)}

/* 思考块 */
.think{margin-bottom:10px;font-size:13px;color:var(--fg2)}
.think summary{list-style:none;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--fg2);font-size:13px}
.think summary::-webkit-details-marker{display:none}
.think .in{margin-top:8px;padding-left:11px;border-left:2px solid var(--line);
  font-size:calc(14px * var(--fs));color:var(--fg2);white-space:pre-wrap}
.mdwrap p{animation:wf .22s ease}
@keyframes wf{from{opacity:.35}to{opacity:1}}
.cursor{display:none!important;width:7px;height:15px;background:var(--blue);vertical-align:-2px;
  margin-left:2px;animation:blink .9s steps(1) infinite;border-radius:1px}
@keyframes blink{50%{opacity:0}}
.dots{display:inline-flex;gap:4px;align-items:center;height:18px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--fg3);animation:up 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes up{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}

.code{background:#0f0f0f;border:1px solid #2c2c2c;border-radius:12px;margin:0 0 14px;overflow:hidden}
body[data-theme="light"] .code{background:#f7f8fa;border-color:#e6e8ec}
body[data-theme="light"] .code-h{background:#eef0f4;border-bottom-color:#e6e8ec;color:#6b7280}
body[data-theme="light"] .code-h button{color:#374151}
body[data-theme="light"] .code code{color:#1f2937}
.code-h{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#181818;
  border-bottom:1px solid #2c2c2c;font-size:12px;color:#8a8a8a;font-family:ui-monospace,Menlo,monospace}
.code-h button{font-size:12px;color:#c8c8c8;padding:2px 6px;border-radius:6px}
.code pre{margin:0;padding:12px;overflow-x:auto}
.code code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;color:#d8d8d8;white-space:pre}

/* 附件 */
.imgs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.imgs img{width:96px;height:96px;object-fit:cover;border-radius:10px;display:block}
.files{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.filecard{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:10px;padding:8px 10px;font-size:13px}
.filecard svg{width:16px;height:16px;flex:0 0 auto;color:var(--fg2)}
.filecard .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filecard .s{color:var(--fg3);font-size:11.5px}

/* 输入区 */
.composer{flex:0 0 auto;padding:0 12px calc(6px + var(--safe-b))}
.composer .wrap{padding:0;max-width:768px}
.attach{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.attach .item{position:relative;width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--card)}
.attach .item img{width:100%;height:100%;object-fit:cover}
.attach .item.doc{display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--fg2);padding:4px;text-align:center;line-height:1.2}
.attach .item .x{position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:50%;
  background:#000a;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}

.inputbar{background:var(--input);border:1px solid var(--line);border-radius:28px;padding:14px 13px 12px 18px}
.inputbar textarea{width:100%;background:none;border:0;outline:none;resize:none;
  font-size:16.5px;line-height:1.55;max-height:132px;min-height:28px;padding:3px 0;color:var(--fg)}
.inputbar textarea::placeholder{color:var(--fg3)}
.holdtalk{padding:7px 0;font-size:16px;color:var(--fg3);text-align:center;cursor:pointer;user-select:none;
  -webkit-user-select:none;touch-action:none}
.holdtalk.rec{color:var(--blue-txt)}
.ibrow{display:flex;align-items:center;gap:8px;margin-top:11px}
.toggles{display:flex;gap:10px;flex:1;min-width:0}
.toggle{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;
  border:1px solid var(--line);color:var(--fg2);font-size:13.5px;white-space:nowrap}
.toggle svg{width:16px;height:16px}
.toggle.on{border-color:transparent;background:var(--blue-soft);color:var(--blue-txt)}
.acts{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.circle{width:36px;height:36px;border-radius:50%;background:var(--card2);display:flex;align-items:center;
  justify-content:center;color:var(--fg)}
.circle:active{opacity:.7}
.circle.send{background:var(--blue);color:#fff}
.circle.send:disabled{background:var(--card2);color:var(--fg3)}
.footnote{text-align:center;font-size:11px;color:var(--fg3);padding:9px 0 0}

/* 抽屉 */
.mask{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:85%;max-width:340px;z-index:50;background:var(--bg);
  display:flex;flex-direction:column;transform:translateX(-102%);
  transition:transform .25s cubic-bezier(.32,.72,0,1);
  padding-top:var(--safe-t);padding-bottom:var(--safe-b);box-shadow:4px 0 24px rgba(0,0,0,.45)}
body[data-theme="light"] .drawer{background:#fff}
.drawer.on{transform:none}
.drawer-head{padding:12px 12px 8px}
.drawer-head .new{display:flex;align-items:center;gap:9px;width:100%;background:var(--card);
  border-radius:12px;padding:12px 14px;font-size:15px;color:var(--fg)}
body[data-theme="light"] .drawer-head .new{background:#fff;border:1px solid var(--line)}
.searchbox{display:flex;align-items:center;gap:9px;margin:14px 14px 6px;padding:11px 14px;border-radius:22px;
  background:var(--card);color:var(--fg3)}
body[data-theme="light"] .searchbox{background:#f2f2f2}
.searchbox input{flex:1;background:none;border:0;outline:none;font-size:14px;color:var(--fg)}
.searchbox input::placeholder{color:var(--fg3)}
.grpbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px;
  font-size:12.5px;color:var(--fg2)}
.grpbar .multi{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--fg2)}
.convs{flex:1;overflow-y:auto;padding:0 6px 10px}
.grp{font-size:12.5px;color:var(--fg2);padding:12px 12px 6px}
.item{display:flex;align-items:center;gap:9px;padding:14px 14px;border-radius:10px;
  font-size:15.5px;color:var(--fg);margin-bottom:2px}
body[data-theme="light"] .item{color:#1a1a1a}
.item.on{background:var(--blue-soft);color:var(--blue-txt)}
body[data-theme="light"] .item.on{background:#e8edff;color:#2f49d9}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:active{opacity:.7}
.empty-tip{color:var(--fg3);font-size:13px;text-align:center;padding:30px 0}
.drawer-foot{border-top:1px solid var(--line);padding:8px}
.fitem{display:flex;align-items:center;gap:10px;padding:12px;border-radius:11px;font-size:15px;color:var(--fg);width:100%}
.fitem svg{width:19px;height:19px;color:var(--fg2)}
.chk{width:21px;height:21px;border-radius:50%;border:1.6px solid var(--fg3);display:flex;align-items:center;
  justify-content:center;font-size:12px;color:#fff;flex:0 0 auto}
.chk.on{background:var(--blue);border-color:var(--blue)}

/* 页面 */
.page{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .25s cubic-bezier(.32,.72,0,1)}
.page.on{transform:none}
.page.sub{z-index:70}
.page-h{height:56px;flex:0 0 auto;display:flex;align-items:center;padding:0 6px;padding-top:var(--safe-t)}
.page-h .t{flex:1;text-align:center;font-size:16.5px;font-weight:600}
.sec{font-size:12.5px;color:var(--fg3);padding:20px 18px 8px}
.group{background:var(--card);border-radius:16px;margin:0 12px;overflow:hidden}
body[data-theme="light"] .group{background:#fff}
.row{display:flex;align-items:center;gap:13px;padding:14px 15px;border-bottom:1px solid var(--line);font-size:15px;color:var(--fg)}
.row:last-child{border-bottom:0}
.row .ic{width:22px;height:22px;flex:0 0 auto}
.row .ic svg{width:22px;height:22px}
.row .k{flex:1}
.row .v{color:var(--fg2);font-size:14px;max-width:56%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{width:16px;height:16px;color:var(--chev);flex:0 0 auto}
.row input{flex:1;background:none;border:0;outline:none;text-align:right;font-size:14px;color:var(--fg2);min-width:0}
.row.tap:active{background:var(--card2)}
.hint{font-size:12px;color:var(--fg3);padding:8px 18px 0;line-height:1.65}
.btn{display:block;width:calc(100% - 24px);margin:0 12px;padding:13px;border-radius:14px;
  background:var(--card);font-size:15px;text-align:center;color:var(--fg)}
.btn.primary,.btn.primary:hover{background:var(--blue)!important;color:#fff!important;font-weight:500}
.btn.danger{color:#ff5f5f}
.sw{width:46px;height:27px;border-radius:99px;background:var(--card2);position:relative;transition:background .18s;flex:0 0 auto}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  transition:transform .18s;display:block;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--blue)}
.sw.on i{transform:translateX(19px)}

.chatstyle{display:flex;gap:10px;padding:0 12px 4px;flex-wrap:wrap}
.chatstyle button{flex:1 1 40%;padding:13px 8px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-size:14.5px;color:var(--fg)}
body[data-theme="light"] .chatstyle button{background:#fff}
.chatstyle button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-txt);font-weight:600}
.swatches{display:flex;gap:10px;padding:12px 16px 4px;flex-wrap:wrap}
.sw-dot{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.sw-dot.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.colorwrap{display:flex;align-items:center;gap:10px;padding:6px 16px 10px}
.colorwrap input[type=color]{width:38px;height:30px;border:1px solid var(--line);border-radius:8px;background:none;padding:0}
.colorwrap .lbl{font-size:13px;color:var(--fg2)}

/* 朗读音色 */
.voicepage{position:fixed;inset:0;z-index:75;background:var(--bg);display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transform:scale(.96);transition:opacity .12s,transform .12s;transition:transform .28s cubic-bezier(.32,.72,0,1)}
.voicepage.on{transform:none}
.voice-h{height:56px;display:flex;align-items:center;padding:0 12px;padding-top:var(--safe-t)}
.voice-h .t{flex:1;text-align:center;font-size:16.5px;font-weight:600}
.voice-h .x{width:34px;height:34px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center}
.voice-body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.vscroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:30px 0}
.vscroll::-webkit-scrollbar{display:none}
.vcard{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;padding:0 30px}
.vblob{width:210px;height:120px;border-radius:999px;position:relative;overflow:hidden;
  background:radial-gradient(120% 130% at 30% 24%,#e8f4f8 0%,#cfe4ee 28%,#b9cfdc 55%,#9db4c4 78%,#8aa0b0 100%);
  box-shadow:inset -12px -14px 34px rgba(90,120,150,.35),inset 12px 10px 26px rgba(255,255,255,.75),0 18px 40px rgba(0,0,0,.22)}
body[data-theme="light"] .vblob{box-shadow:inset -12px -14px 34px rgba(120,150,180,.3),inset 12px 10px 26px rgba(255,255,255,.85),0 18px 40px rgba(0,0,0,.12)}
.vblob.s2{background:radial-gradient(120% 130% at 30% 24%,#fff3e6 0%,#f6ddc2 30%,#e9c39b 58%,#d6a678 82%,#c9945f 100%)}
.vblob.s3{background:radial-gradient(120% 130% at 30% 24%,#eaf6ee 0%,#cfe8d8 30%,#acd3bd 58%,#8dbca4 82%,#7aa992 100%)}
.vblob.s4{background:radial-gradient(120% 130% at 30% 24%,#eeeaf8 0%,#d8d0ee 30%,#bbb0e0 58%,#9c8fd0 82%,#8a7cc2 100%)}
.vname{margin-top:34px;font-size:19px;font-weight:600}
.vdesc{margin-top:8px;font-size:14px;color:var(--fg2)}
.vdots{display:flex;gap:10px;justify-content:center;margin-top:38px}
.vdots i{width:7px;height:7px;border-radius:50%;background:var(--fg3);opacity:.45}
.vdots i.on{background:var(--blue);opacity:1}
.voice-foot{padding:0 20px calc(26px + var(--safe-b))}
.voice-foot .btn{margin:0;width:100%}

/* 附件面板（官方样式） */
.sheet-mask{position:fixed;inset:0;background:#000b;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;background:var(--bg);
  border-radius:18px 18px 0 0;padding:14px 14px calc(14px + var(--safe-b));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
body[data-theme="light"] .sheet{background:#f7f7f7}
.sheet.on{transform:none}
.recent{display:flex;gap:8px;overflow-x:auto;padding:0 0 14px}
.recent::-webkit-scrollbar{display:none}
.recent .r{width:78px;height:78px;border-radius:12px;overflow:hidden;flex:0 0 auto;background:var(--card);
  display:flex;align-items:center;justify-content:center;color:var(--fg3);font-size:10px}
.recent img{width:100%;height:100%;object-fit:cover}
.sheet-row{display:flex;gap:10px}
.sheet-row button{flex:1;background:var(--card);border-radius:14px;padding:16px 8px;
  display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13.5px;color:var(--fg)}
body[data-theme="light"] .sheet-row button{background:#fff}
.sheet-row svg{width:24px;height:24px}
.sheet-cancel{margin-top:10px;width:100%;padding:14px;border-radius:14px;background:var(--card);
  color:var(--fg);font-size:15px}
body[data-theme="light"] .sheet-cancel{background:#fff}

/* AI 消息长按菜单 */
.aimenu{position:fixed;z-index:96;width:178px;border-radius:14px;padding:4px;
  background:var(--card);box-shadow:0 8px 30px #0002,0 0 0 1px var(--line);
  opacity:0;pointer-events:none;transform:scale(.96);transform-origin:top left;
  transition:opacity .12s ease,transform .12s ease}
.aimenu.on{opacity:1;pointer-events:auto;transform:none}
.aimenu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;
  border-radius:10px;font-size:14.5px;color:var(--fg);border:0;text-align:left;background:none}
.aimenu svg{width:18px;height:18px;flex:0 0 auto;color:var(--fg2)}
.aimenu button:active{background:var(--card2)}
.aimenu button:last-child{border-bottom:0}
.aimenu button:active{background:var(--card2)}
.aimenu svg{width:18px;height:18px;flex:0 0 auto;color:var(--fg2)}

/* 会话菜单 */
.convmenu-mask{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .18s;z-index:85}
.convmenu-mask.on{opacity:1;pointer-events:auto}
.convmenu{position:fixed;left:50%;top:50%;width:264px;background:var(--card);border-radius:14px;overflow:hidden;
  z-index:86;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.94);
  transition:opacity .16s,transform .16s;box-shadow:0 12px 40px rgba(0,0,0,.5)}
body[data-theme="light"] .convmenu{background:#fff}
.convmenu.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.convmenu button{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;font-size:15.5px;
  color:var(--fg);border-bottom:1px solid var(--line);text-align:left}
.convmenu button:last-child{border-bottom:0}
.convmenu button.danger{color:#ff5f5f}
.convmenu svg{width:19px;height:19px;flex:0 0 auto}

.dialog-mask{position:fixed;inset:0;background:#000b;z-index:88;display:none;align-items:center;justify-content:center;padding:26px}
.dialog-mask.on{display:flex}
.dialog{background:var(--card);border-radius:18px;padding:22px;max-width:340px;width:100%;color:var(--fg)}
body[data-theme="light"] .dialog{background:#fff}
.dialog h3{margin:0 0 12px;font-size:17px;text-align:center}
.dialog .txt{font-size:14px;color:var(--fg2);line-height:1.8;max-height:52vh;overflow:auto}
.dialog .txt b{color:var(--fg)}
.dialog .ok{margin-top:18px;width:100%;padding:12px;border-radius:12px;background:var(--blue);color:#fff;font-size:15.5px}
.dlg-input{width:100%;margin-top:12px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);outline:none;font-size:15px}
.dlg-actions{display:flex;gap:10px;margin-top:16px}
.dlg-actions button{flex:1;padding:11px;border-radius:12px;font-size:15px;background:var(--card2);color:var(--fg)}
.dlg-actions button.primary{background:var(--blue);color:#fff}

.legal{padding:18px 20px 40px;font-size:14px;line-height:1.85;color:var(--fg2)}
.legal h3{font-size:14.5px;color:var(--fg);margin:22px 0 8px;font-weight:600}
.legal p{margin:0 0 10px}
.legal strong{color:var(--fg)}

.viewer{position:fixed;inset:0;z-index:90;background:#000;display:none;align-items:center;justify-content:center}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,10px);
  background:#333;color:#fff;font-size:13.5px;padding:9px 16px;border-radius:12px;
  z-index:99;opacity:0;pointer-events:none;transition:.2s;max-width:80vw;text-align:center}
body[data-theme="light"] .toast{background:#222c}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

function inline(s){
  s=s.replace(/`([^`]+)`/g,function(m,c){ return '<code class="ic">'+c+'</code>'; });
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');

  s=s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer noopener">$1</a>');
  return s;
}
function cleanOut(t){

function md(src){
  if(!src) return '';
  var blocks=[];
  var s=String(src).replace(/```([^\n`]*)\n?([\s\S]*?)```/g,function(m,lang,code){
    blocks.push({lang:(lang||'').trim(),code:code});
    return '\u0000CB'+(blocks.length-1)+'\u0000';
  });
  s=esc(s);
  var lines=s.split('\n'), out=[], i=0;
  while(i<lines.length){
    var Ln=lines[i];
    if(/^\s*$/.test(Ln)){ i++; continue; }
    if(/^\u0000CB\d+\u0000$/.test(Ln.trim())){ out.push(Ln.trim()); i++; continue; }
    var m;
    if((m=Ln.match(/^(#{1,6})\s+(.*)$/))){
      var lv=m[1].length;
      out.push('<h'+lv+'>'+inline(m[2])+'</h'+lv+'>'); i++; continue;
    }
    if(/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(Ln)){ out.push('<hr>'); i++; continue; }
    if(/^\s*&gt;\s?/.test(Ln)){
      var bufq=[];
      while(i<lines.length && /^\s*&gt;\s?/.test(lines[i])){ bufq.push(lines[i].replace(/^\s*&gt;\s?/,'')); i++; }
      out.push('<blockquote>'+inline(bufq.join(' '))+'</blockquote>'); continue;
    }
    if(/^\s*([-*+])\s+/.test(Ln) || /^\s*\d+[.)]\s+/.test(Ln)){
      var ordered=/^\s*\d+[.)]\s+/.test(Ln), items=[];
      while(i<lines.length && (/^\s*([-*+])\s+/.test(lines[i]) || /^\s*\d+[.)]\s+/.test(lines[i]))){
        items.push(lines[i].replace(/^\s*(?:[-*+]|\d+[.)])\s+/,'')); i++;
      }
      var tag=ordered?'ol':'ul';
      out.push('<'+tag+'>'+items.map(function(x){ return '<li>'+inline(x)+'</li>'; }).join('')+'</'+tag+'>');
      continue;
    }
    if(Ln.indexOf('|')>=0 && i+1<lines.length && /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(lines[i+1])){
      var cells=function(r){ return r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){ return c.trim(); }); };
      var head=cells(Ln); i+=2;
      var rows=[];
      while(i<lines.length && lines[i].indexOf('|')>=0 && !/^\s*$/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      var tb='<table><thead><tr>'+head.map(function(h){ return '<th>'+inline(h)+'</th>'; }).join('')+'</tr></thead><tbody>';
      tb+=rows.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+inline(c)+'</td>'; }).join('')+'</tr>'; }).join('');
      out.push(tb+'</tbody></table>'); continue;
    }
    var buf=[Ln]; i++;
    while(i<lines.length && !/^\s*$/.test(lines[i]) &&
          !/^(#{1,6}\s|\s*([-*+])\s|\s*\d+[.)]\s|\s*&gt;|\u0000CB)/.test(lines[i])){
      buf.push(lines[i]); i++;
    }
    out.push('<p>'+buf.map(inline).join('<br>')+'</p>');
  }
  var html=out.join('\n');
  html=html.replace(/\u0000CB(\d+)\u0000/g,function(m,n){
    var c=blocks[+n]||{lang:'',code:''};
    var code=c.code.replace(/\n$/,'');
    return '<div class="code"><div class="code-h"><span>'+esc(c.lang||'code')+

      '<pre><code>'+esc(code)+'</code></pre></div>';
  });
  return html;
}

  if(r.status===401 && !retry){
    if(await sbRefresh()) return sbReq(path, opts, true);
  }
  if(!r.ok){ var t=''; try{ t=await r.text(); }catch(e){} throw new Error(t||('HTTP '+r.status)); }
  return r;
}
async function sbPushAll(){
  if(!isLogged()||!convs.length) return 0;
  var rows=convs.map(function(c){
    return { id:String(c.id), user_id:SES.user.id, title:c.title||'', payload:c, updated_at:new Date(c.ts||Date.now()).toISOString() };
  });
  await sbReq('/rest/v1/conversations?on_conflict=id',{
    method:'POST',
    headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify(rows)
  });
  return rows.length;
}
async function sbPullAll(){
  if(!isLogged()) return 0;
  var r=await sbReq('/rest/v1/conversations?select=payload,updated_at&order=updated_at.desc&limit=500');
  var rows=await r.json();
  if(!Array.isArray(rows)) return 0;
  var map={};
  convs.forEach(function(c){ map[c.id]=c; });
  var added=0;
  rows.forEach(function(row){
    var c=row.payload; if(!c||!c.id) return;
    var old=map[c.id];
    if(!old || (c.ts||0) > (old.ts||0)){ map[c.id]=c; if(!old) added++; }
  });
  convs=Object.keys(map).map(function(k){ return map[k]; });
  saveC(); renderConvs(); renderChat(); updateHeadTitle();
  return added;
}
async function sbSync(){
  if(!isLogged()) return false;
  try{
    await sbPushAll();
    await sbPullAll();
    return true;
  }catch(e){
    toast('同步失败：'+(e.message||''));
    return false;
  }
}

var multiMode=false, multiSel=new Set(), searchQ='';
function renderConvs(){
  var box=$('#convs');
  if(!convs.length){ box.innerHTML='<div class="empty-tip">'+t('empty')+'</div>'; updateMultiBar(); return; }
  var now=Date.now();
  var list=convs.slice().sort(function(a,b){ return b.ts-a.ts; });
  if(searchQ){
    var q=searchQ.toLowerCase();
    list=list.filter(function(c){
      if((c.title||'').toLowerCase().indexOf(q)>=0) return true;
      return (c.msgs||[]).some(function(m){ return (m.content||'').toLowerCase().indexOf(q)>=0; });
    });
  }
  var pinned=list.filter(function(c){ return c.pinned; });
  var rest=list.filter(function(c){ return !c.pinned; });
  var groups={}; var keys=[t('today'),t('week'),t('month'),t('older')];
  keys.forEach(function(k){ groups[k]=[]; });
  rest.forEach(function(c){
    var d=(now-c.ts)/86400000;
    var k = d<1?keys[0]:(d<7?keys[1]:(d<30?keys[2]:keys[3]));
    groups[k].push(c);
  });
  function item(c){
    var sel=multiSel.has(c.id);
    return '<div class="item'+(c.id===curId?' on':'')+'" data-id="'+c.id+'">'+
      (multiMode?'<span class="chk'+(sel?' on':'')+'">'+(sel?'✓':'')+'</span>':'')+
      '<span>'+esc(c.title)+'</span></div>';
  }
  var h='';
  if(pinned.length){
    h+='<div class="grp">'+t('pinned')+'</div>';
    pinned.forEach(function(c){ h+=item(c); });
  }
  keys.forEach(function(k){
    if(!groups[k].length) return;
    h+='<div class="grp">'+k+'</div>';
    groups[k].forEach(function(c){ h+=item(c); });
  });
  box.innerHTML=h||'<div class="empty-tip">'+t('empty')+'</div>';
  updateMultiBar();
}
function updateMultiBar(){
  var bar=$('#grpbar');
  if(!bar) return;
  if(multiMode){
    bar.innerHTML='<span id="mbCount">已选 '+multiSel.size+' 项</span>'+
      '<span style="display:flex;gap:10px">'+
      '<button id="mbAll" style="font-size:13px;color:var(--blue-txt)">全选</button>'+
      '<button id="mbDel" style="font-size:13px;color:#ff5f5f">删除</button>'+
      '<button id="mbCancel" style="font-size:13px;color:var(--fg2)">取消</button></span>';
  } else {

      '<button class="multi" id="btnMulti"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6.5" cy="6.5" r="1.5"/><circle cx="6.5" cy="17.5" r="1.5"/><path d="M11 6.5h9M11 17.5h9"/></svg></button>';

document.addEventListener('click',function(e){
  if(e.target.id==='btnMulti'){ multiMode=true; multiSel=new Set(); renderConvs(); }
  if(e.target.id==='mbAll'){
    if(multiSel.size===convs.length) multiSel.clear();
    else convs.forEach(function(c){ multiSel.add(c.id); });

});

        var max=1600,w=img.width,h=img.height;
        if(w>max||h>max){ var k=Math.min(max/w,max/h); w=Math.round(w*k); h=Math.round(h*k); }
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/jpeg',0.82));
      };
      img.onerror=function(){ resolve(null); };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function readDoc(file){
  return new Promise(function(resolve){
    if(file.size>400*1024){ resolve({error:'文件超过 400KB'}); return; }
    var fr=new FileReader();
    fr.onload=function(){
      var txt=String(fr.result||'');
      if(/[\u0000-\u0008\u000E-\u001F]/.test(txt.slice(0,400))){ resolve({error:'二进制文件暂不支持'}); return; }
      resolve({text:txt.slice(0,60000)});
    };
    fr.onerror=function(){ resolve({error:'读取失败'}); };
    fr.readAsText(file,'utf-8');
  });
}

async function webSearch(query){

  var url = /\/v1$/.test(base) ? base+'/tools/search' : base+'/v1/tools/search';
  var res = await fetch(url, {

    headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.apiKey},

  });
  if(!res.ok){
    var t=''; try{ t=await res.text(); }catch(e){}
    throw new Error('HTTP '+res.status+' '+t.slice(0,120));
  }

  var list = j.results||j.data||j.items||j.documents||j.list||[];

function buildMessages(c){
  var arr=[];
  var hint=langHint();
  var env=envContext();
  if(env) arr.push({role:'system',content:env+'（以上是真实环境信息，回答涉及时间、日期、星期时以此为准）'});
  if(hint) arr.push({role:'system',content:hint});
  if(S.chatStyle==='bubble'){
    arr.push({role:'system',content:
      '你现在是在聊天软件里和对方聊天，不是在写文章或写报告。要求：像真人一样口语化说话，可以有情绪、有停顿；不要分点、不要列清单、不要"首先其次最后"这种结构、不要标题；该短就短，该说长就说，不要为了简短而砍掉真心的内容。'});
  }
  c.msgs.forEach(function(m){
    if(!m.content && !(m.images&&m.images.length) && !(m.files&&m.files.length)) return;
    if(m.role==='user'){
      var text=m.content||'';
      if(m.files&&m.files.length){
        text += m.files.map(function(f){ return '\n\n[文件：'+f.name+']\n'+(f.text||''); }).join('');
      }
      if(m.images&&m.images.length){
        var parts=[];
        if(text) parts.push({type:'text',text:text});
        m.images.forEach(function(src){ parts.push({type:'image_url',image_url:{url:src}}); });
        arr.push({role:'user',content:parts});
      } else {
        arr.push({role:'user',content:text});
      }
    } else {
      arr.push({role:'assistant',content:m.content});
    }
  });
  return arr;
}
function splitSentences(text){
  var out=[],buf='',marks='。！？!?…；;\n';
  for(var i=0;i<text.length;i++){
    buf+=text[i];
    if(marks.indexOf(text[i])>=0){
      while(i+1<text.length && marks.indexOf(text[i+1])>=0){ buf+=text[i+1]; i++; }
      if(buf.trim()) out.push(buf);
      buf='';
    }
  }
  if(buf.trim()) out.push(buf);
  return out.length?out:[text];
}
function startWaifu(ai,c){
  if(ai._timer){ clearTimeout(ai._timer); ai._timer=null; }
  ai.shown=1;
  renderChat();
  scrollBottom();
  if(ai.segs.length<=1) return;
  function step(){
    if(ai.shown>=ai.segs.length){ ai._timer=null; saveC(); renderConvs(); return; }
    // 每句之间 0.5～1.1 秒随机，像真人在打字，但比真人快
    // 按下一句的字数决定停顿：短句约 1.2 秒，长句最多 3 秒
    var next = ai.segs[ai.shown] || '';
    var wait = 900 + Math.min(1700, next.length * 80) + Math.random()*400;
    ai._timer=setTimeout(function(){
      ai.shown++;
      renderChat();
      scrollBottom();
      step();
    }, wait);
  }
  step();
}

function shortTitle(text){

async function autoTitle(c){
  if(!c || !S.apiKey) return;
  var first=null;
  for(var i=0;i<c.msgs.length;i++) if(c.msgs[i].role==='user'){ first=c.msgs[i]; break; }
  if(!first) return;
  var seed = first.content || '';
  if(!seed && first.files && first.files.length) seed = '这份文件叫「'+first.files[0].name+'」，请据此概括主题。';
  if(!seed) return;
  var model = S.fastModel || S.model;
  var body = {
    model: model,
    messages: [
      {role:'system',content:'用不超过10个字概括这句话的主题，只输出标题本身，不要引号、标点或解释。'},
      {role:'user',content:String(seed).slice(0,300)}
    ],
    stream: true,
    max_tokens: 256
  };
  try{
    var res = await fetch(S.baseUrl.replace(/\/+$/,'')+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.apiKey},
      body: JSON.stringify(body)
    });
    if(!res.ok){
      var t=''; try{ t=await res.text(); }catch(e){}
      c.titleGen=-1; saveC();
      return;
    }
    var reader=res.body.getReader(), dec=new TextDecoder('utf-8'), buf='', out='';
    while(true){
      var r=await reader.read(); if(r.done) break;
      buf += dec.decode(r.value,{stream:true});
      var idx;
      while((idx=buf.indexOf('\n'))>=0){
        var line=buf.slice(0,idx).replace(/\r$/,''); buf=buf.slice(idx+1);
        if(line.indexOf('data:')!==0) continue;
        var data=line.slice(5).trim();
        if(!data || data==='[DONE]') continue;
        try{
          var j=JSON.parse(data);
          var d=(j.choices&&j.choices[0]&&j.choices[0].delta)||{};
          if(d.content) out+=d.content;
          else if(d.reasoning_content && !out) out += '';
        }catch(e){}
      }
    }
    var ti=out.trim().replace(/^["'「『《]+|["'」』》]+$/g,'').replace(/[。，、！？:：\n]/g,'').slice(0,18);
    if(ti){ c.title=ti; c.titleGen=2; saveC(); renderConvs(); updateHeadTitle(); }
    else { c.titleGen=-1; saveC(); }
  }catch(e){ c.titleGen=-1; saveC(); }
}
async function send(text, retryIndex){
  text=(text||'').trim();
  if(busy) return;
  if(!S.apiKey){ toast(t('notKey')); openSettings(); return; }
  if(!text && !pending.length && retryIndex==null) return;

  var c=cur();
  var isNew=false;
  if(!c){ c={id:String(Date.now()),title:'',msgs:[],ts:Date.now()}; convs.unshift(c); curId=c.id; isNew=true; }

  if(retryIndex!=null){ c.msgs=c.msgs.slice(0,retryIndex); }
  else{
    c.msgs.push({
      role:'user', content:text,
      images:pending.filter(function(a){ return a.kind==='img'; }).map(function(a){ return a.data; }),
      files:pending.filter(function(a){ return a.kind==='doc'; }).map(function(a){ return {name:a.name,size:a.size,text:a.text}; }),
      ts:Date.now()
    });
    pending=[]; renderAttach();
  }
  if(!c.title || c.title===(uiLang()==='zh'?'新对话':'New chat')){
    var _fu=null;
    for(var _i=0;_i<c.msgs.length;_i++){ if(c.msgs[_i].role==='user'){ _fu=c.msgs[_i]; break; } }
    if(_fu && _fu.content) c.title = shortTitle(_fu.content);
    else if(_fu && _fu.files && _fu.files.length) c.title = shortTitle(_fu.files[0].name.replace(/\.[^.]+$/,''));
    else if(_fu && _fu.images && _fu.images.length) c.title = (uiLang()==='zh'?'图片对话':'Image chat');
    saveC(); renderConvs(); updateHeadTitle();
  }

  var model = S.model || S.fastModel;
  var ai={role:'assistant',content:'',reasoning:'',model:model,ts:Date.now(),segs:null,shown:null,think:!!S.think,_typeLen:0};
  c.msgs.push(ai); c.ts=Date.now();
  saveC(); renderConvs(); renderChat(); updateHeadTitle(); setBusy(true); autoScroll=true;

  var _searchCtx='';
  if(S.webSearch){
    try{
      toast('正在联网搜索…');
      _searchCtx = await webSearch(text || (c.msgs[c.msgs.length-2]&&c.msgs[c.msgs.length-2].content) || '');
    }catch(e){ toast('搜索失败：'+(e.message||'')); }
  }
  var _msgs=buildMessages(c);
  if(_searchCtx){
    for(var _k=_msgs.length-1;_k>=0;_k--){
      if(_msgs[_k].role==='user'){
        if(typeof _msgs[_k].content==='string'){
          _msgs[_k].content += '\n\n[以下是刚刚联网搜索到的实时资料，请优先依据这些内容回答，并在结尾注明来源链接]\n'+_searchCtx;
        }
        break;
      }
    }
  }
  var body={model:model,messages:_msgs,stream:true};
  var tp=parseFloat(S.temp);
  if(!/reasoner/i.test(model) && !isNaN(tp)) body.temperature=tp;

  // 打字机：每 33ms 推进一点，让文字平滑吐出
  if(ai._typeTimer) clearInterval(ai._typeTimer);
  ai._typeTimer = setInterval(function(){
    var target=(ai.content||'').length;
    if((ai._typeLen||0) < target){
      var remain = target-(ai._typeLen||0);
      var step = Math.max(1, Math.ceil(remain*0.15));
      ai._typeLen = Math.min(target,(ai._typeLen||0)+step);
      paint();
    }
  }, 33);

  ac=new AbortController();
  var t0=Date.now(), paintLock=false;
  function paint(){
    if(!busy) return;
    if(paintLock) return; paintLock=true;
    requestAnimationFrame(function(){
      paintLock=false;
      if(!busy) return;
      var node=document.querySelector('.msg.ai[data-i="'+(c.msgs.length-1)+'"]');
      if(!node) return;
      var th=node.querySelector('.think');
      if(th) th.outerHTML=thinkHtml(ai);
      var bd=node.querySelector('.body');
      if(bd){
        var shown=(ai.content||'').slice(0, ai._typeLen||0);
        if(!shown){ bd.innerHTML='<span class="dots"><i></i><i></i><i></i></span>'; }
        else { bd.innerHTML=md(shown); }
      }
      scrollBottom();
    });
  }
  try{
    var res=await fetch(S.baseUrl.replace(/\/+$/,'')+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.apiKey},
      body:JSON.stringify(body), signal:ac.signal
    });
    if(!res.ok){
      var d='';
      try{ var j=await res.json(); d=(j.error&&j.error.message)||JSON.stringify(j); }
      catch(e){ d=await res.text().catch(function(){return '';}); }
      throw new Error('HTTP '+res.status+' '+d);
    }
    var reader=res.body.getReader(), dec=new TextDecoder('utf-8'), buf='';
    while(true){
      var r=await reader.read(); if(r.done) break;
      buf+=dec.decode(r.value,{stream:true});
      var idx;
      while((idx=buf.indexOf('\n'))>=0){
        var line=buf.slice(0,idx).replace(/\r$/,''); buf=buf.slice(idx+1);
        if(!line||line.charAt(0)===':') continue;
        if(line.indexOf('data:')!==0) continue;
        var data=line.slice(5).trim();
        if(data==='[DONE]') continue;
        var jj; try{ jj=JSON.parse(data); }catch(e){ continue; }
        var dl=(jj.choices&&jj.choices[0]&&jj.choices[0].delta)||{};
        if(dl.reasoning_content){ ai.reasoning+=dl.reasoning_content; paint(); }
        if(dl.content){ ai.content+=dl.content; paint(); }
      }
    }
    if(ai.reasoning) ai.thinkSec=Math.max(1,Math.round((Date.now()-t0)/1000));
    if(!ai.content && !ai.reasoning) ai.content='…';
  }catch(err){
    if(err&&err.name==='AbortError'){ if(!ai.content) ai.content=t('stop'); }
    else{
      var m=String((err&&err.message)||'error');
      if(m.indexOf('Failed to fetch')>=0) m='网络请求失败，请检查网络与 Base URL';
      ai.content += (ai.content?'\n\n':'')+'请求失败：'+m;
    }
  }finally{
    if(ai._typeTimer){ clearInterval(ai._typeTimer); ai._typeTimer=null; }
    ai._typeLen=(ai.content||'').length;
    ac=null; setBusy(false);
    c.ts=Date.now();
    var doWaifu = S.waifu && S.chatStyle==='bubble' && ai.content && ai.content.indexOf('```')<0;
    if(doWaifu){ ai.segs=splitSentences(ai.content); ai.shown=1; }
    saveC(); renderConvs(); updateHeadTitle(); renderChat();
    if(doWaifu) startWaifu(ai,c);
    if(S.autoplay && ai.content) speak(ai.content);
    if(S.autoTitle!==false && !c.titleGen){ setTimeout(function(){ autoTitle(c); }, 300); }
    if(isLogged()){ sbPushAll().catch(function(){}); }
  }
}

  }

function recLang(){ return S.lang==='system'?'zh-CN':S.lang; }
function startRec(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    $('#dlgTitle').textContent='语音输入暂不支持';
    $('#dlgText').innerHTML='语音功能正在开发中，后续版本会支持，敬请期待。<br><br>现在可以先用键盘打字，一样方便。';
    $('#dlgMask').classList.add('on');
    setVoiceMode(false);
    return;
  }
  if(listening) return;
  if(!rec){
    rec=new SR();
    rec.lang=recLang(); rec.continuous=false; rec.interimResults=true;
    rec.onresult=function(e){
      var txt='';
      for(var i=e.resultIndex;i<e.results.length;i++) txt+=e.results[i][0].transcript;
      $('#input').value=txt;
      $('#input').style.display='';
      $('#input').style.height='auto';
      $('#input').style.height=Math.min($('#input').scrollHeight,120)+'px';
      $('#holdTalk').style.display=(txt||listening)?'none':'block';
      updateSendIcon();
    };
    rec.onerror=function(ev){
      listening=false;
      $('#holdTalk').textContent='按住说话';
      $('#holdTalk').classList.remove('rec');
      $('#dlgTitle').textContent='语音输入暂不支持';
      $('#dlgText').innerHTML='语音功能正在开发中，后续版本会支持，敬请期待。<br><br>现在可以先用键盘打字，一样方便。';
      $('#dlgMask').classList.add('on');
      setVoiceMode(false);
    };
    rec.onend=function(){
      listening=false;
      var v=$('#input').value.trim();
      if(v){ setVoiceMode(false); }
      else {
        $('#holdTalk').textContent='按住说话';
        $('#holdTalk').classList.remove('rec');
        $('#input').style.display='none';
      }
    };
  }
  try{ rec.start(); listening=true; $('#holdTalk').textContent='正在聆听…'; $('#holdTalk').classList.add('rec'); }
  catch(e){}
}
function stopRec(){ if(listening && rec){ try{ rec.stop(); }catch(e){} } }

})();

function copyText(txt){
  txt=String(txt||'');
  function fallback(){
    try{
      var ta=document.createElement('textarea');
      ta.value=txt;
      ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var ok=false;
      try{ ok=document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
      toast(ok?t('copied'):t('copiedFail'));
    }catch(e){ toast(t('copiedFail')); }
  }
  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(function(){ toast(t('copied')); }, fallback);
  } else {
    fallback();
  }
}

  };
}

(function(){

  inp.type='file'; inp.accept='image/*'; inp.id='avatarFile'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.addEventListener('change',async function(){
    var f=this.files&&this.files[0];
    if(f){
      var d=await readAvatar(f);
      if(d){
        if(window.__avWhich==='ai') S.aiAvatar=d; else S.userAvatar=d;
        saveS(); renderChat(); renderSubTheme();
      }
    }
    this.value='';
  });
})();
function readAvatar(file){
  return new Promise(function(resolve){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var side=Math.min(img.width,img.height);
        var cv=document.createElement('canvas'); cv.width=256; cv.height=256;
        cv.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,256,256);
        resolve(cv.toDataURL('image/jpeg',0.86));
      };
      img.onerror=function(){ resolve(null); };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function syncInputs(){
  if($('#mKey')){
    S.apiKey=$('#mKey').value.trim();
    S.baseUrl=$('#mBase').value.trim()||DEF.baseUrl;
    S.provider=/api\.deepseek\.com/.test(S.baseUrl)?'deepseek':'custom';
    S.model=$('#mModel').value.trim()||DEF.model||'deepseek-flash';
    S.fastModel=S.model;
    S.temp=$('#mTemp').value.trim()||DEF.temp;
    saveS();
  }
  if($('#ttsKey')){
    S.tts={prov:(S.tts.prov||'openai'),base:($('#ttsBase').value||'').trim(),key:$('#ttsKey').value.trim(),
      group:($('#ttsGroup')?$('#ttsGroup').value.trim():S.tts.group),
      model:($('#ttsModel').value||'').trim(),voice:($('#ttsVoice').value||'').trim()};
    saveS();
  }
}

var audioEl=$('#audio');
function hexToBytes(hex){
  hex=hex.replace(/[^0-9a-fA-F]/g,'');
  var n=hex.length/2, out=new Uint8Array(n);
  for(var i=0;i<n;i++) out[i]=parseInt(hex.substr(i*2,2),16);
  return out;
}
async function speak(text){
  text=String(text||'').replace(/```[\s\S]*?```/g,'').replace(/[#*`>]/g,'').trim();
  if(!text) return;
  text=text.slice(0,1200);
  var cfg=S.tts, prov=(cfg.prov||'openai').toLowerCase();
  if(!cfg.key||!cfg.base){ toast('请先在「朗读音色 → 自定义语音接口」里配置'); openSub('tts'); return; }
  var base=cfg.base.replace(/\/+$/,'');
  var v=voiceOf();
  try{
    var src;
    if(prov==='minimax'){
      var url=base+'/t2a_v2'+(cfg.group?('?GroupId='+encodeURIComponent(cfg.group)):'');
      var r1=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
        body:JSON.stringify({model:cfg.model||'speech-02-hd',text:text,stream:false,
          voice_setting:{voice_id:cfg.voice||v.minimax,speed:1,vol:1,pitch:0},
          audio_setting:{sample_rate:32000,bitrate:128000,format:'mp3'}})});
      if(!r1.ok) throw new Error('HTTP '+r1.status);
      var j=await r1.json();
      var hex=j&&j.data&&j.data.audio;
      if(!hex) throw new Error('无音频数据');
      src=URL.createObjectURL(new Blob([hexToBytes(hex)],{type:'audio/mpeg'}));
    } else if(prov==='elevenlabs'){
      var r2=await fetch(base+'/text-to-speech/'+encodeURIComponent(cfg.voice||'21m00Tcm4TlvDq8ikWAM')+'?output_format=mp3_44100_128',
        {method:'POST',headers:{'Content-Type':'application/json','xi-api-key':cfg.key},
         body:JSON.stringify({text:text,model_id:cfg.model||'eleven_multilingual_v2'})});
      if(!r2.ok) throw new Error('HTTP '+r2.status);
      src=URL.createObjectURL(new Blob([await r2.arrayBuffer()],{type:'audio/mpeg'}));
    } else {
      var r3=await fetch(base+'/audio/speech',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
        body:JSON.stringify({model:cfg.model||'tts-1',input:text,voice:cfg.voice||v.openai})});
      if(!r3.ok) throw new Error('HTTP '+r3.status);
      src=URL.createObjectURL(new Blob([await r3.arrayBuffer()],{type:'audio/mpeg'}));
    }
    audioEl.src=src;
    audioEl.play().catch(function(){ toast('点击页面后即可播放'); });
  }catch(err){ toast('语音失败：'+((err&&err.message)||'')); }
}

function applyTheme(){
  var th=S.theme;
  if(th==='system'){
    th=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  }
  document.body.dataset.theme=th;
  var root=document.documentElement;
  root.style.setProperty('--fs',S.fontScale);
  var alpha = (S.bubbleAlpha==null?100:S.bubbleAlpha)/100;   // 仅气泡
  function toRgba(hex, a){
    hex = (hex||'').replace('#','');
    if(hex.length===3) hex = hex.split('').map(function(c){return c+c;}).join('');
    var r=parseInt(hex.slice(0,2),16)||0, g=parseInt(hex.slice(2,4),16)||0, b=parseInt(hex.slice(4,6),16)||0;
    return 'rgba('+r+','+g+','+b+','+a+')';
  }
  root.style.setProperty('--bubble-user', toRgba(S.userColor||(th==='light'?'#dfe8ff':'#2d2d2d'), alpha));
  root.style.setProperty('--bubble-ai', toRgba(S.aiColor||(th==='light'?'#ffffff':'#232323'), alpha));
  root.style.setProperty('--bubble-blur', (S.bubbleBlur||0)+'px');
  if(!$('#bgLayer')){
    var bl=document.createElement('div'); bl.id='bgLayer';
    var ar=$('#appRoot'); if(ar) ar.insertBefore(bl, ar.firstChild);
  }
  var app=$('#appRoot');
  root.style.setProperty('--bg-alpha', (S.bgAlpha==null?100:S.bgAlpha)/100);
  root.style.setProperty('--bg-blur', (S.bgBlur||0)+'px');
  root.style.setProperty('--bg-img', S.bgImage?('url("'+S.bgImage+'")'):'none');
  root.style.setProperty('--bg-color', S.chatBg||'transparent');
  app.style.backgroundImage=''; app.style.backgroundColor='transparent';
  root.style.setProperty('--chat-bg',S.chatBg||(th==='light'?'#fbfbfb':'#0d0d0d'));
  var m=document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content',th==='light'?'#fbfbfb':'#0d0d0d');
  var sr=$('#styleRoot');
  sr.classList.remove('style-command','style-bubble');
  var bs = (S.chatStyle==='bubble');
  sr.classList.add('style-'+(bs?'bubble':'command'));
  sr.classList.toggle('wide',!!S.wideBubble);
  sr.classList.toggle('glass',!!S.glass);
}

/* ================= 返回键层级 ================= */
window.addEventListener('popstate', function(){
  var sub=$('#pageSub'), main=$('#pageMain'), dr=$('#drawer');
  if(sub && sub.classList.contains('on')){ syncInputs(); sub.classList.remove('on'); renderSettings(); return; }
  if(main && main.classList.contains('on')){ main.classList.remove('on'); return; }
  if(dr && dr.classList.contains('on')){ closeDrawer(); return; }
  // 都在最底层：交还给系统（退出 App）
});

/* ================= 启动 ================= */
applyTheme();
applyLang();
renderConvs();
renderChat();
updateHeadTitle();
renderSettings();
$('#tgThink').classList.toggle('on',!!S.think);
$('#tgSearch').classList.toggle('on',!!S.webSearch);
$('#btnMute').classList.toggle('on',!!S.autoplay);
setBusy(false);
updateMuteIcon();
updateSendIcon();
setTimeout(firstRun,400);
})();
</script>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
